# NEXORA full stack. Usage:
#   cp .env.example .env   # then change every secret
#   docker compose up --build
# App: http://localhost:${NEXORA_HTTP_PORT:-8088}   Admin: /admin/   API docs: /api/swagger-ui.html

name: nexora

x-restart: &restart
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    <<: *restart
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--default-time-zone=+00:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    <<: *restart
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: nexora/api:local
    <<: *restart
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${NEXORA_PUBLIC_URL:-http://localhost:8088}
      NEXORA_SEED_DEMO: ${NEXORA_SEED_DEMO:-false}
      NEXORA_DEMO_PASSWORD: ${NEXORA_DEMO_PASSWORD:-}
    networks: [backend]

  realtime:
    build:
      context: .
      dockerfile: infrastructure/docker/realtime.Dockerfile
    image: nexora/realtime:local
    <<: *restart
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_URL: http://api:8080
      CORS_ORIGINS: ${NEXORA_PUBLIC_URL:-http://localhost:8088}
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: nexora/web:local
    <<: *restart
    networks: [frontend]

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
    image: nexora/admin:local
    <<: *restart
    networks: [frontend]

  nginx:
    build:
      context: .
      dockerfile: infrastructure/docker/nginx.Dockerfile
    image: nexora/nginx:local
    <<: *restart
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
      web: { condition: service_healthy }
      admin: { condition: service_healthy }
    ports:
      - "${NEXORA_HTTP_PORT:-8088}:80"
    networks: [frontend, backend]

networks:
  frontend:
  backend:

volumes:
  mysql-data:
  redis-data:
