<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NEXORA: intelligent workflow and collaboration platform for teams running many projects at once." />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NEXORA · Intelligent workflow & collaboration</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('nexora-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
