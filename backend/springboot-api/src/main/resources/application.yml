server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: nexora-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:nexora}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:nexora}
    password: ${MYSQL_PASSWORD:nexora}
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: ${FLYWAY_LOCATIONS:filesystem:../../database/migrations}
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

nexora:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cookie-secure: ${COOKIE_SECURE:false}
  seed-demo: ${NEXORA_SEED_DEMO:false}
  demo-password: ${NEXORA_DEMO_PASSWORD:}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4200}
  events-stream: nexora:events

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.nexora: INFO
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.nexora: DEBUG
