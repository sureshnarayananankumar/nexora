# Static server for the Angular admin SPA, served under /admin/ (inside the admin container).
server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

  location ~* ^/admin/.+\.(js|css|svg|woff2?)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  location /admin/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /admin/index.html;
  }
}
