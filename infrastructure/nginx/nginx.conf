# NEXORA edge proxy: one origin for both SPAs, the REST API and WebSockets.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s "$http_user_agent"';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Brute-force protection for authentication endpoints (the API also rate-limits per email).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream web      { server web:8080; }
  upstream admin    { server admin:8080; }
  upstream api      { server api:8080; keepalive 32; }
  upstream realtime { server realtime:4000; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

    location = /nginx-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

    location /api/v1/auth/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/proxy_params.conf;
    }

    location /api/ {
      proxy_pass http://api;
      include /etc/nginx/proxy_params.conf;
    }

    location /socket.io/ {
      proxy_pass http://realtime;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }

    # Realtime gateway metrics for the admin console (the service itself requires an admin token).
    location = /realtime/metrics {
      proxy_pass http://realtime/metrics;
      include /etc/nginx/proxy_params.conf;
    }

    location = /admin { return 301 /admin/; }
    location /admin/ {
      proxy_pass http://admin;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web;
      proxy_set_header Host $host;
    }
  }
}
