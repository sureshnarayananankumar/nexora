name: Demo site (GitHub Pages)

# Publishes the real React app and Angular admin console with an in-browser sample-data API
# (frontend/demo-api) to https://<owner>.github.io/nexora/. No backend runs here.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'infrastructure/scripts/build-pages-demo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/react-client/package-lock.json
            frontend/angular-admin/package-lock.json
      - run: npm ci
        working-directory: frontend/react-client
      - run: npm ci
        working-directory: frontend/angular-admin
      - name: Build demo site
        run: bash infrastructure/scripts/build-pages-demo.sh _site "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
