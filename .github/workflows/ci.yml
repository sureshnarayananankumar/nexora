name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Spring Boot API
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/springboot-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + integration tests (Testcontainers MySQL & Redis)
        run: mvn -B -ntp verify -Pintegration
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-reports, path: backend/springboot-api/target/surefire-reports, if-no-files-found: ignore }

  realtime:
    name: Node.js realtime
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/node-realtime } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: backend/node-realtime/package-lock.json }
      - run: sudo apt-get install -y redis-server
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    name: React client
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/react-client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/react-client/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  admin:
    name: Angular admin
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/angular-admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/angular-admin/package-lock.json }
      - run: npm ci
      - run: npm run test:ci
      - run: npx ng build --configuration production

  e2e:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, realtime, web, admin]
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment (throwaway secrets)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')|" .env
          sed -i "s|^MYSQL_PASSWORD=.*|MYSQL_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^NEXORA_DEMO_PASSWORD=.*|NEXORA_DEMO_PASSWORD=Ci-Demo-$(openssl rand -hex 6)1|" .env
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 420
      - name: Smoke test through Nginx
        run: ./infrastructure/scripts/smoke-test.sh http://localhost:8088
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
